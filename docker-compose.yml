services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: admito
      POSTGRES_PASSWORD: admito
      POSTGRES_DB: admito
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admito"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      ConnectionStrings__Default: Host=db;Database=admito;Username=admito;Password=admito
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    volumes:
      - ./backend:/src
      - /src/bin
      - /src/obj
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
